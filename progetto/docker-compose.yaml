services:
  backend:
    build: ./backend
    container_name: backend_service
    ports:
      - "8003:8003"
    volumes:
      - ./gs_data:/app/gs_data
      - ./domains.json:/app/domains.json
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend_service
    ports:
      - "8000:8000"
    depends_on:
      - backend
    restart: always
